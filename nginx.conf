# Mounted over the nginx:alpine default config (see docker-compose.yml).
# no-cache = the browser may keep a copy but must check with the server
# (cheap ETag revalidation) before using it, so deploys show up immediately.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
